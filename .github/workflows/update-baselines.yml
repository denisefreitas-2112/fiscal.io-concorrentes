name: Atualizar baselines dos concorrentes

on:
  schedule:
    - cron: "0 8 * * 1"   # toda segunda-feira às 8h UTC (5h BRT)
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 lxml

      - name: Rodar script de baselines
        run: python update_baselines.py

      - name: Commitar baselines.json se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baselines.json
          git diff --staged --quiet || git commit -m "chore: atualiza baselines dos concorrentes [$(date '+%Y-%m-%d')]"
          git push
